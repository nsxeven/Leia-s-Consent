<svg xmlns="http://www.w3.org/2000/svg" width="690" height="1070" viewBox="0 0 690 1070">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f6f8"/>
      <stop offset="0.18" stop-color="#aeb3bb"/>
      <stop offset="0.42" stop-color="#e8eaed"/>
      <stop offset="0.68" stop-color="#9298a1"/>
      <stop offset="0.86" stop-color="#dfe2e6"/>
      <stop offset="1" stop-color="#a7acb4"/>
    </linearGradient>
  </defs>

  <!-- Concentric hardware rings: the inner edge of the silver rim and the
       outer edge of the black bezel share the same rounded contour. -->
  <rect x="10" y="10" width="670" height="1050" rx="50" ry="50"
        fill="none" stroke="url(#silver)" stroke-width="5"/>

  <rect x="18" y="18" width="654" height="1034" rx="42" ry="42"
        fill="none" stroke="#070709" stroke-width="11"/>

  <!-- Subtle inner glass edge; the center remains transparent for the UI. -->
  <rect x="26" y="26" width="638" height="1018" rx="35" ry="35"
        fill="none" stroke="#2a2a2e" stroke-width="1.5" opacity="0.55"/>
</svg>
