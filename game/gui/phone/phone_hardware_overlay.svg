<svg xmlns="http://www.w3.org/2000/svg" width="690" height="1070" viewBox="0 0 690 1070">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f4f6"/>
      <stop offset="0.22" stop-color="#a9aeb6"/>
      <stop offset="0.48" stop-color="#e2e4e8"/>
      <stop offset="0.72" stop-color="#8d939c"/>
      <stop offset="1" stop-color="#d6d9de"/>
    </linearGradient>
  </defs>

  <!-- Opaque black perimeter masks the older pale shell underneath. -->
  <rect x="11" y="11" width="668" height="1048" rx="48" ry="48"
        fill="none" stroke="#050507" stroke-width="22"/>

  <!-- Very thin metallic edge at the absolute outside. -->
  <rect x="3" y="3" width="684" height="1064" rx="53" ry="53"
        fill="none" stroke="url(#silver)" stroke-width="5"/>

  <!-- Inner glass/bezel transition. -->
  <rect x="22" y="22" width="646" height="1026" rx="39" ry="39"
        fill="none" stroke="#17171a" stroke-width="4"/>

  <!-- Transparent center preserves the live Phone screen. -->
</svg>
