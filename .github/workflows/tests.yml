name: tests

# Runs the pure-Python test suite (no Ren'Py needed) on every PR to main and
# every push to main. The suite includes the clean-up guard rails:
# effective-definition fingerprints, save-name baseline and structure rules.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pillow
      - name: Run tests
        env:
          PYTHONPATH: game/python-packages
        run: python -m unittest discover -s tests -v
